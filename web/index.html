<title>Super Earth Ballistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0c1210;
  --bg-grid:#0f1613;
  --surface:#141c19;
  --surface-2:#1b2521;
  --surface-3:#22302a;
  --border:#2b3833;
  --border-soft:#1f2925;
  --text:#e9efe7;
  --text-dim:#9fb0a6;
  --text-faint:#6c8078;
  --accent:#ffc93c;
  --accent-dim:#c99f2e;
  --accent-ink:#241a04;
  --good:#6fcf7d;
  --good-dim:#264a2c;
  --warn:#f2a33f;
  --warn-dim:#4a3a1f;
  --danger:#e2564a;
  --danger-dim:#4a2420;
  --terminid:#e3873a;
  --automaton:#5f9bd6;
  --illuminate:#b073e0;
  --shadow: 0 8px 24px rgba(0,0,0,.45);
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    linear-gradient(180deg, rgba(255,201,60,.04), transparent 220px),
    repeating-linear-gradient(0deg, var(--bg-grid) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(90deg, var(--bg-grid) 0 1px, transparent 1px 28px),
    var(--bg);
  color:var(--text);
  font-family:'IBM Plex Sans KR', 'IBM Plex Sans', sans-serif;
  min-height:100vh;
}
h1,h2,h3,.display{
  font-family:'Oswald', 'IBM Plex Sans KR', sans-serif;
  text-transform:uppercase;
  letter-spacing:.04em;
  text-wrap:balance;
}
.mono{font-family:'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums;}
a{color:var(--accent);}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

/* ---------- shell ---------- */
.shell{max-width:1400px; margin:0 auto; padding:20px 20px 64px;}

.topbar{
  display:flex; align-items:flex-end; justify-content:space-between; gap:24px;
  border-bottom:2px solid var(--accent-dim); padding-bottom:14px; margin-bottom:18px;
  flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:14px;}
.brand-mark{
  width:44px; height:44px; border:2px solid var(--accent); border-radius:3px;
  display:flex; align-items:center; justify-content:center; color:var(--accent);
  font-family:'Oswald'; font-weight:700; font-size:20px; flex:none;
  background: repeating-linear-gradient(45deg, rgba(255,201,60,.08) 0 4px, transparent 4px 8px);
}
.brand h1{font-size:26px; margin:0; color:var(--text); font-weight:700;}
.brand .sub{color:var(--text-faint); font-size:11px; letter-spacing:.12em; text-transform:uppercase; margin-top:2px;}
.topbar-right{display:flex; align-items:center; gap:10px;}
.tag{
  font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-ink);
  background:var(--accent); padding:4px 8px; border-radius:2px; font-weight:600;
}
.lang-toggle{
  font-size:11px; letter-spacing:.04em; color:var(--text-dim); background:var(--surface-2);
  border:1px solid var(--border); padding:5px 10px; border-radius:3px; cursor:pointer; font-weight:600;
}
.lang-toggle:hover{border-color:var(--accent); color:var(--accent);}
.sidebar-search{padding:8px 10px 4px;}
.sidebar-search input{
  width:100%; box-sizing:border-box; background:var(--surface-2); border:1px solid var(--border);
  color:var(--text); padding:7px 10px; border-radius:20px; font-size:13px;
}
.sidebar-search input:focus{border-color:var(--accent);}
.enemy-empty{padding:14px 12px; color:var(--text-faint); font-size:12.5px;}

.disclaimer{
  background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--warn);
  color:var(--text-dim); font-size:12.5px; line-height:1.6; padding:10px 14px; border-radius:2px;
  margin-bottom:18px;
}
.disclaimer b{color:var(--warn);}

.split-layout{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px; align-items:start;}
@media (max-width:800px){ .split-layout{grid-template-columns:minmax(0,1fr);} }
#compare-panel{margin-top:18px;}
#result-panel{border-top:1px solid var(--border-soft);}

/* ---------- panels (weapon / mob) ---------- */
.panel{
  background:var(--surface); border:1px solid var(--border); border-radius:4px;
  box-shadow:var(--shadow); min-width:0;
}
.panel-head{
  padding:10px 14px; border-bottom:1px solid var(--border-soft);
  font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); font-weight:600;
}
.dot{width:9px; height:9px; border-radius:50%; flex:none;}
.sub-tag{
  display:inline-block; font-size:9px; letter-spacing:.03em; text-transform:uppercase;
  color:var(--illuminate); border:1px solid var(--illuminate); border-radius:3px;
  padding:1px 4px; margin-right:2px; vertical-align:middle; opacity:.85;
}

/* ---------- calculator / mob detail ---------- */
#weapon-info, #mob-info, #result-panel{padding:16px 18px;}
.dossier-top{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;}
.dossier-name{font-size:28px; margin:0 0 4px; color:var(--text);}
.dossier-meta{display:flex; gap:8px; flex-wrap:wrap;}
.chip{
  font-size:11px; padding:3px 8px; border-radius:20px; border:1px solid var(--border);
  color:var(--text-dim); letter-spacing:.03em; display:inline-flex; align-items:center; gap:5px;
}
.mark{width:64px; height:64px; flex:none;}

.section-label{
  font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint);
  margin:18px 0 8px; display:flex; align-items:center; gap:8px;
}
.section-label::after{content:''; flex:1; height:1px; background:var(--border-soft);}

table{border-collapse:collapse; width:100%; font-size:13px;}
.table-wrap{overflow-x:auto; border:1px solid var(--border-soft); border-radius:3px;}
th{
  text-align:left; font-family:'Oswald'; font-weight:500; letter-spacing:.05em; text-transform:uppercase;
  font-size:11px; color:var(--text-faint); padding:8px 10px; background:var(--surface-2);
  border-bottom:1px solid var(--border); white-space:nowrap; position:sticky; top:0;
}
th.sortable{cursor:pointer; user-select:none;}
th.sortable:hover{color:var(--accent);}
th .arrow{opacity:.6; margin-left:3px;}
td{padding:7px 10px; border-bottom:1px solid var(--border-soft); white-space:nowrap; color:var(--text);}
tr:last-child td{border-bottom:none;}
tr.weak-row td:first-child{color:var(--accent);}
.num-in{
  width:64px; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  padding:3px 5px; border-radius:3px; font-family:'IBM Plex Mono'; font-size:12.5px;
}
select.armor-sel{
  background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:3px 5px;
  border-radius:3px; font-size:12px;
}
.starbtn{background:none;border:none;cursor:pointer;font-size:15px;color:var(--text-faint);line-height:1;}
.starbtn.on{color:var(--accent);}

.intel{
  background:var(--surface-2); border:1px dashed var(--border); border-radius:3px; padding:12px 14px; margin-top:6px;
}
.intel ul{margin:0; padding-left:18px; color:var(--text-dim); font-size:13px; line-height:1.75;}
.intel li::marker{color:var(--accent-dim);}
.intel b{color:var(--text);}

.chips-row{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 2px;}
.part-chip{
  background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim);
  padding:5px 10px; border-radius:20px; font-size:12.5px; cursor:pointer; display:flex; align-items:center; gap:5px;
}
.part-chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600;}
.part-chip .w{color:var(--accent);}

.part-images{display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; margin:4px 0 10px;}
.part-images figure{margin:0; background:var(--surface-2); border:1px solid var(--border); border-radius:4px; padding:6px; text-align:center;}
.part-images img{display:block; max-height:150px; max-width:220px; width:auto; border-radius:2px; background:#000;}
.part-images figcaption{font-size:10.5px; color:var(--text-faint); margin-top:4px; letter-spacing:.04em; text-transform:uppercase;}
.img-credit{font-size:10.5px; color:var(--text-faint); align-self:center;}

.weapon-combo{position:relative; width:100%;}
.weapon-combo input.combo-input{
  width:100%; box-sizing:border-box; background:var(--surface-2); border:1px solid var(--border);
  color:var(--text); padding:8px 12px; border-radius:20px; font-size:13.5px;
}
.weapon-combo input.combo-input:focus{border-color:var(--accent);}
.weapon-combo-list{
  position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:20; max-height:280px; overflow-y:auto;
  background:var(--surface-3); border:1px solid var(--border); border-radius:4px; box-shadow:var(--shadow);
}
.weapon-combo-item{padding:7px 10px; font-size:12.5px; color:var(--text-dim); cursor:pointer; display:flex; justify-content:space-between; gap:8px;}
.weapon-combo-item:hover, .weapon-combo-item.hl{background:var(--surface-2); color:var(--text);}
.weapon-combo-item .cat{font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.03em;}
.weapon-combo-empty{padding:8px 10px; font-size:12px; color:var(--text-faint);}
.bp-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.4fr); gap:14px; align-items:start;}
@media (max-width:1100px){ .bp-grid{grid-template-columns:minmax(0,1fr);} }
.bp-col{background:var(--surface-2); border:1px solid var(--border-soft); border-radius:4px; padding:12px 14px; min-width:0;}
.bp-col-wide{grid-column:span 1;}
.bp-col-title{font-family:'Oswald'; font-size:13px; letter-spacing:.05em; text-transform:uppercase; color:var(--accent); margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--border-soft);}
.weapon-name-cell{display:flex; align-items:center; gap:8px;}
.weapon-thumb{width:36px; height:26px; object-fit:cover; border-radius:2px; border:1px solid var(--border-soft); background:#000; flex:none;}
.bp-weapon-img{background:var(--surface); border:1px solid var(--border-soft); border-radius:4px; padding:8px; margin-bottom:10px; text-align:center;}
.bp-weapon-img img{max-width:100%; max-height:130px; border-radius:2px;}
.bp-subhead{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); margin:10px 0 4px;}
.bp-stat{display:flex; justify-content:space-between; gap:10px; padding:3px 0; font-size:12.5px; color:var(--text-dim); border-bottom:1px dotted var(--border-soft);}
.bp-stat span:first-child{color:var(--text-faint);}
.bp-stat span:last-child{color:var(--text);}
.bp-hit{background:var(--surface); border:1px solid var(--border-soft); border-radius:3px; padding:8px 10px; margin-bottom:8px;}
.bp-hit-type{font-size:11px; font-weight:600; color:var(--accent-dim); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px;}
.bp-tiles{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; margin-top:12px;}
@media (max-width:420px){ .bp-tiles{grid-template-columns:repeat(2, minmax(0,1fr));} }
.bp-tile{background:var(--surface); border:1px solid var(--border-soft); border-radius:4px; padding:8px 10px; display:flex; flex-direction:column; gap:2px; min-width:0;}
.bp-tile span{font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em;}
.bp-tile b{font-family:'IBM Plex Mono'; font-size:17px; color:var(--accent); font-weight:600;}

.stat-sections{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; margin:10px 0;}
@media (max-width:520px){ .stat-sections{grid-template-columns:minmax(0,1fr);} }
.stat-section{background:var(--surface); border:1px solid var(--border-soft); border-radius:4px; padding:10px 14px; align-self:start; min-width:0;}
.stat-section-title{font-family:'Oswald'; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; padding-bottom:5px; border-bottom:1px solid var(--border-soft);}
.stat-section .bp-stat input.num-in{width:64px; text-align:right;}

.stat-cards{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; margin:10px 0;}
@media (max-width:420px){ .stat-cards{grid-template-columns:repeat(2, minmax(0,1fr));} }
.stat-card{background:var(--surface); border:1px solid var(--border-soft); border-radius:4px; padding:8px 10px; display:flex; flex-direction:column; gap:4px; min-width:0;}
.stat-card-wide{grid-column:1 / -1;}
.stat-card > span:first-child{font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em;}
.stat-card b{font-family:'IBM Plex Mono'; font-size:16px; color:var(--accent); font-weight:600;}
.stat-card .stat-val-row{display:flex; align-items:baseline; gap:3px;}
.stat-card input.num-in{
  width:100%; box-sizing:border-box; background:transparent; border:none; padding:0;
  font-family:'IBM Plex Mono'; font-size:16px; color:var(--accent); font-weight:600;
}
.stat-card input.num-in:focus{outline:1px solid var(--accent); outline-offset:2px; border-radius:2px;}
.stat-card .unit{font-family:'IBM Plex Mono'; font-size:13px; color:var(--accent-dim);}
.stat-card .starbtn{font-size:20px; text-align:left; padding:0;}
.part-chip.active .w{color:var(--accent-ink);}

.weapon-panel{padding:18px 20px;}
.weapon-head{display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:6px;}
.tabs{display:flex; gap:4px; background:var(--surface-2); padding:3px; border-radius:20px; border:1px solid var(--border);}
.tab-btn{
  background:transparent; border:none; color:var(--text-dim); padding:6px 14px; border-radius:16px;
  font-size:12.5px; cursor:pointer; font-weight:500;
}
.tab-btn.active{background:var(--accent); color:var(--accent-ink); font-weight:600;}
.reset-btn{
  background:transparent; border:1px solid var(--border); color:var(--text-dim); padding:6px 12px;
  border-radius:3px; cursor:pointer; font-size:12px;
}
.reset-btn:hover{border-color:var(--danger); color:var(--danger);}

.status-pill{
  font-size:11px; padding:2px 8px; border-radius:20px; font-weight:600; display:inline-flex; align-items:center; gap:4px;
}
.status-full{background:var(--good-dim); color:var(--good);}
.status-partial{background:var(--warn-dim); color:var(--warn);}
.status-blocked{background:var(--danger-dim); color:var(--danger);}

.best-badge{
  background:var(--accent); color:var(--accent-ink); font-size:10px; font-weight:700; padding:1px 6px;
  border-radius:3px; margin-left:6px; letter-spacing:.03em;
}

footer{margin-top:26px; color:var(--text-faint); font-size:11.5px; text-align:center; line-height:1.8;}
footer a{color:var(--text-faint); text-decoration:underline;}

@media (prefers-reduced-motion: no-preference){
  .panel, tr{transition: background-color .12s ease, border-color .12s ease;}
}
</style>

}

function weaponHits(w){
  return (w.hits && w.hits.length) ? w.hits : [{type:"Projectile", dmg:w.dmg, durable:w.durable, apDirect:w.pen}];
}
/**
 * Straight from DiversDex's own cell documentation (pasted in by the user, not guessed):
 *
 * ARMOR: "If AP > part's Armor Value: 100% damage (Red Hitmarker). If AP == Armor: 65%
 * damage (White Hitmarker). If AP < Armor: NO damage (Ricochet)."
 *
 * DURABILITY: "This percentage determines the proportion of standard damage and durable
 * damage a part receives. A part with 60% durability receives 40% of the weapon's standard
 * damage and 60% of its durable damage."
 *
 * These apply in TWO STEPS, not blended independently:
 *   1. durability% blends the weapon's standard damage and durable damage into one
 *      "raw" damage value (60% durability -> 40% standard + 60% durable).
 *   2. THAT blended value is then multiplied by the armor tier (100%/65%/0%) - so a
 *      ricochet (AP < Armor) zeroes out the WHOLE hit, durable share included. This
 *      matches the doc's flat "AP < Armor: NO damage" with no exception for durability.
 * (`durable` here is stored as a fraction of `dmg` - i.e. rawDurableDamage / rawDamage
 * from the sheet - so multiplying it by `dmg` recovers the raw durable-damage number the
 * sheet lists separately.)
 *
 * Only the primary (first-listed) hit component is used - whether a second component (e.g.
 * an explosion) also lands on the SAME struck part is a geometry question this project
 * doesn't model (see the Breakpoint tab's own note on that).
 */
function armorMultiplier(ap, armor){
  if(ap > armor) return 1;
  if(ap === armor) return 0.65;
  return 0;
}
function hitEffDamage(h, armor, partDurability){
  var pd = partDurability || 0;
  var blended = h.dmg * (1 - pd) + (h.dmg * h.durable) * pd;
  return blended * armorMultiplier(h.apDirect, armor);
}
/**
 * A weapon can list several hit components with DIFFERENT penetration ratings on purpose
 * (e.g. PLAS-1 Scorcher's own notes: "the explosion can penetrate medium armor but the
 * plasma projectile has only light armor penetration") - the player picks whichever one
 * actually gets through. So BTK/TTK use whichever component deals the most damage against
 * THIS target's armor, not just whichever is listed first.
 */
function bestHit(w, armor, partDurability){
  var hits = weaponHits(w);
  var best = hits[0], bestDmg = hitEffDamage(best, armor, partDurability);
  for(var i=1;i<hits.length;i++){
    var d = hitEffDamage(hits[i], armor, partDurability);
    if(d > bestDmg){ bestDmg = d; best = hits[i]; }
  }
  return { hit: best, dmg: bestDmg };
}
function totalEffDamage(w, armor, partDurability){
  return bestHit(w, armor, partDurability).dmg;
}
function penStatus(w, armor, partDurability){
  var h = bestHit(w, armor, partDurability).hit;
  var mult = armorMultiplier(h.apDirect, armor);
  if(mult === 1) return "full";
  if(mult === 0.65) return "half";
  var pd = partDurability || 0;
  return (pd > 0 && h.durable > 0) ? "partial" : "blocked";
}

/* ============ shared BTK/TTK math ============ */
function computeRow(w, part, mainHp, regen){
  var effDmg = totalEffDamage(w, part.armor, part.durability);
  var btk;
  if(effDmg <= 0){
    btk = Infinity; // ricocheting off the armor entirely - no amount of shots gets through
  } else if(part.lethal){
    var lethalHp = part.hp > 0 ? part.hp : mainHp;
    btk = Math.ceil(lethalHp / effDmg);
  } else if(part.toMain > 0){
    btk = Math.ceil(mainHp / (effDmg * part.toMain));
  } else {
    btk = Infinity;
  }
  btk = isFinite(btk) ? Math.max(1, btk) : btk;
  var sever = (part.hp > 0 && effDmg > 0) ? Math.max(1, Math.ceil(part.hp / effDmg)) : null;
  var shotInterval = w.mag > 1 ? (w.rpm > 0 ? 60 / w.rpm : 0) : 0;
  var reloadsNeeded = isFinite(btk) ? (w.mag > 1 ? Math.floor((btk - 1) / w.mag) : (btk - 1)) : Infinity;
  var ttk = isFinite(btk) ? (btk - 1) * shotInterval + reloadsNeeded * w.reload : Infinity;
  var killsPerMag = isFinite(btk) ? (Math.max(1, Math.floor(w.mag / btk)) || 0) : 0;
  var poolUsed = part.lethal ? (part.hp > 0 ? part.hp : mainHp) : mainHp;
  var dealt = isFinite(btk) ? btk * effDmg * (part.lethal ? 1 : part.toMain) : Infinity;
  var overkill = isFinite(dealt) ? Math.max(0, dealt - poolUsed) : Infinity;

  // Regenerating enemies (e.g. Crusher): sustained fire has to out-pace the regen rate on any
  // part not in the exempt list, or the part effectively never runs out - this only ever flags
  // slow/weak weapons since most primaries already clear a typical ~30 hp/s regen easily; a real
  // fight's dodge/reload downtime (which regen keeps ticking through) isn't modeled here at all.
  var regenWarning = false;
  if(regen && regen.exempt.indexOf(part.name) === -1){
    var interval = w.mag > 1 ? shotInterval : Math.max(w.reload, 0.1);
    var sustainedDps = effDmg / Math.max(interval, 0.01);
    if(sustainedDps <= regen.rate) regenWarning = true;
  }

  return {
    eff: effDmg, btk: btk, sever: sever, ttk: ttk,
    killsPerMag: killsPerMag, status: penStatus(w, part.armor, part.durability),
    reloads: reloadsNeeded, overkill: overkill, regenWarning: regenWarning,
    magPct: isFinite(btk) ? btk / w.mag : Infinity
  };
}

  }).slice(0, 40);
  if(!matches.length){ overlay.innerHTML = '<div class="weapon-combo-empty">'+esc(t('bp_empty'))+'</div>'; return; }
  overlay.innerHTML = matches.map(function(x){
    return '<div class="weapon-combo-item'+(x.id===selectedWeapon?' hl':'')+'" data-id="'+x.id+'"><span>'+dispName(x)+'</span><span class="cat">'+(x.subcat?subcatLabel(x.subcat):catLabel(x.cat))+'</span></div>';
  }).join('');
  Array.prototype.forEach.call(overlay.querySelectorAll(".weapon-combo-item"), function(item){
    item.addEventListener("mousedown", function(ev){
      ev.preventDefault(); // fires before input's blur, so the click still registers
      selectedWeapon = item.getAttribute("data-id");
      renderWeaponInfo();
      renderResultPanel();
      if(compareVisible) renderComparePanel();
      overlay.hidden = true;
    });
  });
}
(function(){
  var input = document.getElementById("weapon-search-input");
  var overlay = document.getElementById("weapon-search-overlay");
  input.addEventListener("focus", function(){ this.select(); renderWeaponSearchOverlay(""); overlay.hidden = false; });
  input.addEventListener("input", function(){ renderWeaponSearchOverlay(this.value); overlay.hidden = false; });
  input.addEventListener("blur", function(){ setTimeout(function(){ overlay.hidden = true; renderWeaponInfo(); }, 150); });
})();

function renderWeaponInfo(){
  var w = findWeapon(selectedWeapon);
  var hits = weaponHits(w);
  document.getElementById("weapon-search-input").value = w.nameKo || w.name;

  var html = '';
  html += '<h2 class="dossier-name" style="font-size:20px;">'+dispName(w)+'</h2>';
  if(w.img){
    html += '<div class="bp-weapon-img"><img src="'+esc(w.img)+'" alt="'+esc(w.name)+'" onerror="this.parentElement.style.display=\'none\'"></div>';
  }
  html += '<div class="stat-sections">';
  html += '<div class="stat-section"><div class="stat-section-title">'+t('bp_col_weapon')+'</div>';
  html += statRow(t('stat_cat'), catLabel(w.cat));
  html += statRow(t('stat_mag'), fmt(w.mag));
  html += statRow(t('stat_rpm'), fmt(w.rpm));
  html += statRow(t('stat_reload'), fmt(w.reload,2));
  if(w.tacReload) html += statRow(t('stat_tacreload'), fmt(w.tacReload,2));
  if(w.ergonomics) html += statRow(t('stat_ergo'), fmt(w.ergonomics));
  html += '</div>';
  hits.forEach(function(h){
    html += '<div class="stat-section"><div class="stat-section-title">'+esc(h.type)+'</div>';
    html += statRow(t('stat_dmg'), fmt(h.dmg));
    html += statRow(t('stat_durabledmg'), fmt(h.dmg*h.durable));
    html += statRow(t('stat_pen4'), h.apDirect+' / '+h.apSlight+' / '+h.apLarge+' / '+h.apExtreme);
    if(h.outerRadius) html += statRow(t('stat_blastradius'), fmt(h.innerRadius,1)+'m / '+fmt(h.outerRadius,1)+'m');
    if(h.falloff50m) html += statRow(t('stat_falloff50'), fmtPct(h.falloff50m));
    html += '</div>';
  });
  html += '</div>';

  document.getElementById("weapon-info").innerHTML = html;
}

/* ============ 3. result panel (BTK/TTK output, shared by whichever weapon+mob are picked) ============ */
function renderResultPanel(){
  var e = findEnemy(selectedEnemy);
  if(selectedPart >= e.parts.length) selectedPart = 0;
  var part = e.parts[selectedPart];
  var w = findWeapon(selectedWeapon);
  var mainHp = e.mainHp;
  var c = computeRow(w, part, mainHp, e.regen);
  var hits = weaponHits(w);

  var html = '<div class="weapon-head">';
  html += '<div class="tabs"><button class="tab-btn active" disabled>'+t("bp_title")+'</button></div>';
  html += '<button class="reset-btn" id="compare-toggle-btn">'+(compareVisible?t("compare_toggle_hide"):t("compare_toggle_show"))+'</button>';
  html += '<button class="reset-btn" id="reset-btn">'+t("reset_btn")+'</button>';
  html += '</div>';

  html += '<div class="section-label">'+dispName(w)+' → '+dispName(e)+' / '+esc(part.name)+'</div>';

  html += '<div class="bp-tiles">';
  html += '<div class="bp-tile"><span>'+t('tile_btk')+'</span><b>'+fmtNum(c.btk)+'</b></div>';
  html += '<div class="bp-tile"><span>'+t('tile_ttk')+'</span><b>'+fmtNum(c.ttk,2)+'</b></div>';
  html += '<div class="bp-tile"><span>'+t('tile_overkill')+'</span><b>'+fmtNum(c.overkill)+'</b></div>';
  html += '<div class="bp-tile"><span>'+t('tile_reloads')+'</span><b>'+fmtNum(c.reloads)+'</b></div>';
  html += '<div class="bp-tile"><span>'+t('tile_magpct')+'</span><b>'+fmtPct(c.magPct)+'</b></div>';
  html += '<div class="bp-tile"><span>'+t('tile_killspermag')+'</span><b>'+c.killsPerMag+'</b></div>';
  html += '</div>';

  html += '<div class="section-label" style="margin-top:16px;">'+t("bp_col_detail")+'</div>';
  html += '<div class="table-wrap"><table><thead><tr><th>'+t('detail_col_component')+'</th><th class="mono">'+t('detail_col_pen')+'</th><th class="mono">'+t('detail_col_armor')+'</th><th>'+t('detail_col_judge')+'</th><th class="mono">'+t('detail_col_dmg')+'</th><th>'+t('detail_col_applied')+'</th></tr></thead><tbody>';
  var chosen = bestHit(w, part.armor, part.durability).hit;
  hits.forEach(function(h){
    var mult = armorMultiplier(h.apDirect, part.armor);
    var judgeHtml = mult===1 ? '<span class="status-pill status-full">'+t('status_full')+'</span>'
      : mult===0.65 ? '<span class="status-pill status-partial">'+t('status_half')+'</span>'
      : '<span class="status-pill status-blocked">'+t('status_blocked')+'</span>';
    var isChosen = h === chosen;
    html += '<tr'+(isChosen?'':' style="opacity:.55;"')+'><td>'+esc(h.type)+'</td><td class="mono">'+h.apDirect+'</td><td class="mono">'+part.armor+'</td>'+
      '<td>'+judgeHtml+'</td>'+
      '<td class="mono">'+fmtNum(hitEffDamage(h, part.armor, part.durability))+'</td>'+
      '<td>'+(isChosen?'<span class="status-pill status-full">'+t('detail_applied')+'</span>':'<span class="status-pill status-blocked">'+t('detail_notapplied')+'</span>')+'</td></tr>';
  });
  html += '<tr style="font-weight:600;"><td colspan="4">'+t('detail_total_row')+'</td><td class="mono">'+fmtNum(c.eff)+'</td><td></td></tr>';
  if(!part.lethal){
    html += '<tr><td colspan="4">'+t('detail_mainshare_row')+' '+fmtPct(part.toMain)+')</td><td class="mono">'+fmtNum(c.eff*part.toMain)+'</td><td></td></tr>';
  }
  html += '</tbody></table></div>';
  if(hits.length > 1){
    html += '<div class="img-credit" style="margin-top:6px;">'+t('multi_hit_note')+'</div>';
  }

  html += '<div class="section-label" style="margin-top:14px;">'+t('results_summary_label')+'</div>';
  html += '<div class="intel"><ul>';
  html += '<li>'+dispName(w)+'(으)로 '+esc(part.name)+' 부위를 '+fmtNum(c.btk)+'발 맞히면 '+(part.lethal?'그 부위 파괴로 즉사':'메인 체력 소모로 처치')+'됩니다 (약 '+fmtNum(c.ttk,2)+'초, 재장전 '+fmtNum(c.reloads)+'회 포함).</li>';
  html += '<li>마지막 한 발의 초과 피해(오버킬)는 약 '+fmtNum(c.overkill)+'이며, 탄창의 '+fmtPct(c.magPct)+'을 소모합니다.</li>';
  if(c.sever!==null && c.sever!==c.btk){ html += '<li>이 부위 자체(껍데기)만 파괴하는 데는 '+c.sever+'발이면 충분합니다 (전체 처치와는 별개).</li>'; }
  if(c.regenWarning){ html += '<li style="color:var(--danger);">⚠ 이 무기의 지속 DPS가 이 부위의 재생 속도를 못 넘습니다 — 계속 쏴도 체력이 안 줄어들 수 있습니다. 재생 없는 부위(위 "재생" 항목 참고)나 순간 폭딜 수단으로 바꾸세요.</li>'; }
  html += '</ul></div>';

  document.getElementById("result-panel").innerHTML = html;
  wireResultPanelEvents();
}

function wireResultPanelEvents(){
  document.getElementById('reset-btn').addEventListener('click', function(){
    if(confirm(t('reset_confirm'))) resetAll();
  });
  document.getElementById('compare-toggle-btn').addEventListener('click', function(){
    compareVisible = !compareVisible;
    document.getElementById('compare-panel').hidden = !compareVisible;
    renderResultPanel();
    if(compareVisible) renderComparePanel();
  });
}

/* ============ 4. compare panel (secondary/optional full comparison table) ============ */
function renderComparePanel(){
  var panel = document.getElementById('compare-panel');
  panel.hidden = !compareVisible;
  if(!compareVisible) return;

  var e = findEnemy(selectedEnemy);
  if(selectedPart >= e.parts.length) selectedPart = 0;
  var part = e.parts[selectedPart];

  var html = '<div class="weapon-head"><div class="tabs"><button class="tab-btn active" disabled>'+t("tab_compare")+'</button></div></div>';
  html += '<div class="section-label" style="margin-top:16px;">'+t("compare_hint")+'</div>';

  var rows = state.weapons.filter(function(w){ return catFilter==="all" || w.cat===catFilter; });
  html += '<div class="chips-row" style="margin-bottom:10px;">'+catChipsHtml()+'</div>';

  var computed = rows.map(function(w){ return {w:w, c:computeRow(w, part, e.mainHp, e.regen)}; });
  var minBtk = Math.min.apply(null, computed.map(function(r){return r.c.btk;}));
  var minTtk = Math.min.apply(null, computed.map(function(r){return r.c.ttk;}));

  computed.sort(function(a,b){
    var va = sortKey==="ttk"? a.c.ttk : a.c.btk;
    var vb = sortKey==="ttk"? b.c.ttk : b.c.btk;
    return (va-vb)*sortDir;
  });

  html += '<div class="table-wrap"><table><thead><tr>';
  html += '<th>'+t("col_weapon")+'</th><th>'+t("col_category")+'</th><th class="mono">'+t("col_pen")+'</th><th class="mono">'+t("col_dmg")+'</th><th class="mono">'+t("col_durabledmg")+'</th><th class="mono">'+t("col_rpm")+'</th><th class="mono">'+t("col_mag")+'</th><th class="mono">'+t("col_reload")+'</th><th>'+t("col_status")+'</th>';
  html += '<th class="sortable" data-sort="btk">'+t("col_btk")+'<span class="arrow">'+(sortKey==="btk"?(sortDir>0?'▲':'▼'):'')+'</span></th>';
  html += '<th class="sortable" data-sort="ttk">'+t("col_ttk")+'<span class="arrow">'+(sortKey==="ttk"?(sortDir>0?'▲':'▼'):'')+'</span></th>';
  html += '<th class="mono">'+t("col_killspermag")+'</th>';
  html += '<th class="mono">'+t("col_sever")+'</th>';
  html += '<th></th>';
  html += '</tr></thead><tbody>';

  computed.forEach(function(r){
    var w = r.w, c = r.c, h0 = weaponHits(w)[0];
    var statusHtml = c.status==="full" ? '<span class="status-pill status-full">'+t("status_full")+'</span>'
      : c.status==="half" ? '<span class="status-pill status-partial">'+t("status_half")+'</span>'
      : c.status==="partial" ? '<span class="status-pill status-partial">'+t("status_partial")+'</span>'
      : '<span class="status-pill status-blocked">'+t("status_blocked")+'</span>';
    var thumb = w.img ? '<img class="weapon-thumb" src="'+esc(w.img)+'" alt="" onerror="this.style.display=\'none\'">' : '';
    html += '<tr>';
    html += '<td><div class="weapon-name-cell">'+thumb+'<span>'+dispName(w)+(c.btk===minBtk && isFinite(minBtk)?'<span class="best-badge">'+t("best_btk")+'</span>':'')+(c.ttk===minTtk && isFinite(minTtk) ?'<span class="best-badge">'+t("best_ttk")+'</span>':'')+'</span></div></td>';
    html += '<td>'+catLabel(w.cat)+'</td>';
    html += '<td><input class="num-in mono" type="number" min="0" max="10" data-id="'+w.id+'" data-field="pen" value="'+h0.apDirect+'"></td>';
    html += '<td><input class="num-in mono" type="number" data-id="'+w.id+'" data-field="dmg" value="'+h0.dmg+'"></td>';
    html += '<td><input class="num-in mono" type="number" step="5" min="0" data-id="'+w.id+'" data-field="durableDmg" value="'+Math.round(h0.dmg*h0.durable)+'"></td>';
    html += '<td><input class="num-in mono" type="number" data-id="'+w.id+'" data-field="rpm" value="'+w.rpm+'"></td>';
    html += '<td><input class="num-in mono" type="number" data-id="'+w.id+'" data-field="mag" value="'+w.mag+'"></td>';
    html += '<td><input class="num-in mono" type="number" step="0.1" data-id="'+w.id+'" data-field="reload" value="'+w.reload+'"></td>';
    html += '<td>'+statusHtml+'</td>';
    html += '<td class="mono">'+fmtNum(c.btk)+(c.regenWarning?' <span class="status-pill status-partial" title="'+t("regen_title")+'">'+t("regen_badge")+'</span>':'')+'</td>';
    html += '<td class="mono">'+fmtNum(c.ttk,2)+'</td>';
    html += '<td class="mono">'+c.killsPerMag+'</td>';
    html += '<td class="mono">'+(c.sever===null?'-':c.sever)+'</td>';
    html += '<td><button class="reset-btn bp-jump" data-id="'+w.id+'" style="padding:3px 8px;font-size:11px;">'+t("col_detail")+'</button></td>';
    html += '</tr>';
  });
  html += '</tbody></table></div>';

  panel.innerHTML = html;
  wireComparePanelEvents();
}

function wireComparePanelEvents(){
  wireCatChips('#compare-panel');
  Array.prototype.forEach.call(document.querySelectorAll('#compare-panel th.sortable'), function(th){
    th.addEventListener('click', function(){
      var k = th.getAttribute('data-sort');
      if(sortKey===k) sortDir *= -1; else { sortKey = k; sortDir = 1; }
      renderComparePanel();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('#compare-panel .bp-jump'), function(btn){
    btn.addEventListener('click', function(){
      selectedWeapon = btn.getAttribute('data-id');
      renderWeaponInfo();
      renderResultPanel();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('#compare-panel input.num-in'), function(inp){
    inp.addEventListener('change', function(){
      var id = inp.getAttribute('data-id'), field = inp.getAttribute('data-field');
      var w = findWeapon(id);
      var h0 = weaponHits(w)[0];
      var v = +inp.value;
      if(field==="durableDmg"){ h0.durable = Math.max(0, v) / Math.max(h0.dmg, 0.01); }
      else if(field==="mag"){ w.mag = Math.max(1, Math.round(v)); }
      else if(field==="pen"){ h0.apDirect = Math.max(0, Math.round(v)); }
      else if(field==="dmg"){ h0.dmg = Math.max(0, v); }
      else { w[field] = Math.max(0, v); }
      save(); renderComparePanel();
      if(id===selectedWeapon){ renderResultPanel(); renderWeaponInfo(); }
    });
  });
}

function statRow(label, value){
  return '<div class="bp-stat"><span>'+label+'</span><span class="mono">'+value+'</span></div>';
}

function applyStaticStrings(){
  document.getElementById("hdr-sub").textContent = t("app_sub");
  document.getElementById("hdr-tag").textContent = t("app_tag");
  document.getElementById("disclaimer-box").innerHTML = t("disclaimer_html");
  document.getElementById("weapon-col-head").textContent = t("weapon_col_head");
  document.getElementById("mob-col-head").textContent = t("mob_col_head");
  document.getElementById("weapon-search-input").placeholder = t("bp_search_ph");
  document.getElementById("enemy-search-input").placeholder = t("sidebar_search_ph");
  document.getElementById("footer-box").innerHTML = t("footer_html");
  var toggle = document.getElementById("lang-toggle");
  toggle.textContent = t("lang_toggle");
  toggle.setAttribute("aria-label", lang === "ko" ? "Switch to English" : "한국어로 전환");
}
document.getElementById("lang-toggle").addEventListener("click", function(){
  setLang(lang === "ko" ? "en" : "ko");
});

function renderAll(){
  renderWeaponCatFilter();
  renderWeaponSubcatFilter();
  renderWeaponInfo();
  renderMobInfo();
  renderResultPanel();
  if(compareVisible) renderComparePanel();
}
document.getElementById("compare-panel").hidden = true;
applyStaticStrings();
renderAll();
})();
</script>
